<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABG Clinical Interpreter - Social Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0052CC 0%, #0066FF 50%, #1E40AF 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 80px;
            overflow: hidden;
        }

        .left-section {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .blood-drop {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        .drop-shape {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF2D55 0%, #FF3B66 50%, #CC1F44 100%);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.4), inset -10px -10px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .drop-shine {
            position: absolute;
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            top: 20px;
            left: 20px;
        }

        .heartbeat {
            position: absolute;
            width: 120px;
            height: 100px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .heartbeat-line {
            width: 100%;
            height: 3px;
            background: white;
            position: absolute;
            top: 50%;
            left: 0;
            border-radius: 2px;
        }

        .right-section {
            flex: 1;
            margin-left: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            max-width: 600px;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .title {
            font-size: 56px;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            line-height: 1.5;
            max-width: 550px;
        }

        .accent-bar {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #FF2D55, #FF6B9D);
            border-radius: 2px;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .heartbeat-line {
            animation: pulse 1.2s infinite;
        }
    </style>
</head>
<body>
    <div class="left-section">
        <div class="blood-drop">
            <div class="drop-shape">
                <div class="drop-shine"></div>
                <svg class="heartbeat" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 10 50 L 25 50 L 30 35 L 35 50 L 50 50 L 55 30 L 60 50 L 110 50"
                          stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="right-section">
        <div class="accent-bar"></div>
        <div class="subtitle">Clinical Interpreter</div>
        <h1 class="title">ABG Analysis</h1>
        <p class="description">Rule-based clinical calculator for arterial blood gas analysis. Interpret pH, O₂, CO₂ and more.</p>
    </div>
</body>
</html>
